<h2>Program azi</h2>
<p>Alege filmul și vino la ora potrivită.</p>

<div class="filme">
  @for (film of filme; track film.id) {
  <article class="film">
    <div class="ora">{{ film.ora }}</div>
    <h3>{{ film.titlu }}</h3>
    <p>{{ film.durata }} minute</p>
  </article>
  } @empty {
  <p>Nu există filme în program.</p>
  }
</div>
